name: Fix SpaceLaunch JavaScript
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix chart script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          bad="const vals=Array.from({length:36},(_,i)=>seed*(1+(Math.sin(i*.62)*.05)+(i/900));"
          good="const vals=Array.from({length:36},(_,i)=>seed*(1+(Math.sin(i*.62)*.05)+(i/900)));"
          if bad not in s:
              raise SystemExit("Target text not found")
          p.write_text(s.replace(bad,good))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix SpaceLaunch chart JavaScript syntax"
          git push
